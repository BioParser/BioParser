# HTTPS/TLS reverse proxy: Traefik routes encrypted traffic to the bioparser API.
# Enabled by adding :docker-compose.traefik.yml to COMPOSE_FILE in .env.

services:
  traefik:
    image: traefik:v3.3.4@sha256:cc11989f418e2cfe5e60fc40c92c1813be847f58eda15eced7d5ac890255ad9e
    command:
      # Entry points for HTTP (80) and HTTPS (443)
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # HTTP to HTTPS global redirect (respects host port mapping when changed)
      - --entrypoints.web.http.redirections.entrypoint.to=:${TRAEFIK_HTTPS_PORT:-443}
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      # Dynamic file provider (avoids mounting Docker socket for least privilege)
      - --providers.file.directory=/etc/traefik/conf.d
      - --providers.file.watch=true
      # Internal health check ping endpoint
      - --ping=true
      - --ping.entrypoint=ping
      - --entrypoints.ping.address=:8082
      # Logging (JSON format to integrate seamlessly with Loki/Alloy logging stack)
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --log.format=json
      - --accesslog=true
      - --accesslog.format=json
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
    ports:
      - "${TRAEFIK_BIND_ADDRESS:-127.0.0.1}:${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_BIND_ADDRESS:-127.0.0.1}:${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/traefik:/etc/traefik/conf.d:ro
    networks:
      - edge
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    memswap_limit: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entrypoint=ping", "--entrypoints.ping.address=:8082"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
