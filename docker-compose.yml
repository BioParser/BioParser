name: bioparser

networks:
  edge:
  backend:
    internal: true

services:
  mineru:
    build:
      context: .
      dockerfile: docker/mineru.Dockerfile
      # target and image come from the overlay; cpu/gpu.yml
    environment:
      # Parse jobs MinerU runs at once; more wait in its queue. Each running job needs its own
      # memory: raise the overlay's mem_limit with it.
      MINERU_API_CONCURRENCY: ${MINERU_API_CONCURRENCY:-1}
    # Only on the internal network, so it cannot be published. For the host scripts see
    # docs/parser.md.
    restart: unless-stopped
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  vllm:
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${HF_CACHE_DIR:-${USERPROFILE:-${HOME}}/.cache/huggingface}:/root/.cache/huggingface
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    ipc: host
    init: true
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
    # edge is required: vLLM pulls model weights from HuggingFace.
    # Drop to [backend] only once ~/.cache/huggingface has them saved
    # Might need HF_HUB_OFFLINE=1 otherwise it hangs on connect 
    networks: [backend, edge]

  bioparser:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      mineru:
        condition: service_healthy
      vllm:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BIOPARSER_VLLM_BASE_URL: http://vllm:8000/v1
      BIOPARSER_MINERU_BASE_URL: http://mineru:8000
      BIOPARSER_MINERU_TIMEOUT_SECONDS: ${BIOPARSER_MINERU_TIMEOUT_SECONDS:-600}
      BIOPARSER_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BIOPARSER_ARTIFACT_STORAGE_PATH: /data
      BIOPARSER_PARSE_QUEUE_NAME: parse
      BIOPARSER_API_KEY: ${BIOPARSER_API_KEY:-}
      BIOPARSER_AUTH_DISABLED: ${BIOPARSER_AUTH_DISABLED:-false}
    volumes:
      - artifacts:/data
    ports:
      - "127.0.0.1:${BIOPARSER_PORT:-8080}:8080"
    # mineru and vllm get a ceiling from the cpu/gpu overlay; this service had
    # none, so it was the one that could take the host down.
    mem_limit: 4g
    memswap_limit: 4g
    networks: [backend, edge]

  parser-worker:
    build:
      context: .
      dockerfile: docker/parser-worker.Dockerfile
    image: bioparser-parser-worker
    depends_on:
      mineru:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      BIOPARSER_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BIOPARSER_ARTIFACT_STORAGE_PATH: /data
      BIOPARSER_PARSE_QUEUE_NAME: parse
      BIOPARSER_EXTRACT_QUEUE_NAME: extract
      BIOPARSER_MINERU_BASE_URL: http://mineru:8000
      BIOPARSER_PARSE_TIME_LIMIT_SECONDS: ${BIOPARSER_PARSE_TIME_LIMIT_SECONDS:-1800}
    volumes:
      - artifacts:/data
    # MinerU runs in its own service. The default backend (pdfplumber) frees each page
    # after reading it: 316 MiB peak on a 150-page, 15 MiB PDF (1.5 GiB without that).
    mem_limit: 2g
    memswap_limit: 2g
    restart: unless-stopped
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  extractor-worker:
    build:
      context: .
      dockerfile: docker/extractor-worker.Dockerfile
    image: bioparser-extractor-worker
    depends_on:
      redis:
        condition: service_healthy
      vllm:
        condition: service_healthy
    environment:
      BIOPARSER_VLLM_BASE_URL: http://vllm:8000/v1
      BIOPARSER_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BIOPARSER_ARTIFACT_STORAGE_PATH: /data
      BIOPARSER_EXTRACT_QUEUE_NAME: extract
    volumes:
      - artifacts:/data
    mem_limit: 4g
    memswap_limit: 4g
    restart: unless-stopped
    networks: [backend]

  redis:
    # Also pinned in .github/workflows/ci.yml. Dependabot updates only this line.
    image: redis:8.10.2@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    user: "999:999"
    command:
      - redis-server
      - --appendonly yes
      - --appendfsync everysec
      - --save ""
      - --maxmemory ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy noeviction
      - --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    networks: [backend]
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  redis-data:
  artifacts:
