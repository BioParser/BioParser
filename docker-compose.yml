name: bioparser

networks:
  edge:
  backend:
    internal: true

services:
  mineru:
    build:
      context: .
      dockerfile: docker/mineru.Dockerfile
      # target and image come from the overlay; cpu/gpu.yml
    environment:
      # Parse jobs MinerU runs at once; more wait in its queue. Each running job needs its own
      # memory: raise the overlay's mem_limit with it.
      MINERU_API_CONCURRENCY: ${MINERU_API_CONCURRENCY:-1}
    # Only on the internal network, so it cannot be published. For the host scripts see
    # docs/parser.md.
    restart: unless-stopped
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  vllm:
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    ipc: host
    init: true
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
    # edge is required: vLLM pulls model weights from HuggingFace.
    # Drop to [backend] only once ~/.cache/huggingface has them saved
    # Might need HF_HUB_OFFLINE=1 otherwise it hangs on connect 
    networks: [backend, edge]

  bioparser:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: bioparser-api
    depends_on:
      mineru:
        condition: service_healthy
      vllm:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      BIOPARSER_VLLM_BASE_URL: http://vllm:8000/v1
      BIOPARSER_MINERU_BASE_URL: http://mineru:8000
      BIOPARSER_MINERU_TIMEOUT_SECONDS: ${BIOPARSER_MINERU_TIMEOUT_SECONDS:-600}
      BIOPARSER_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BIOPARSER_DATABASE_URL: postgresql://bioparser:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/bioparser
      BIOPARSER_ARTIFACT_STORAGE_PATH: /data
      BIOPARSER_PARSE_QUEUE_NAME: parse
      BIOPARSER_API_KEY: ${BIOPARSER_API_KEY:-}
      BIOPARSER_AUTH_DISABLED: ${BIOPARSER_AUTH_DISABLED:-false}
    volumes:
      - artifacts:/data
    ports:
      - "127.0.0.1:${BIOPARSER_PORT:-8080}:8080"
    # mineru and vllm get a ceiling from the cpu/gpu overlay; this service had
    # none, so it was the one that could take the host down.
    mem_limit: 4g
    memswap_limit: 4g
    networks: [backend, edge]

  parser-worker:
    build:
      context: .
      dockerfile: docker/parser-worker.Dockerfile
    image: bioparser-parser-worker
    depends_on:
      mineru:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      BIOPARSER_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BIOPARSER_DATABASE_URL: postgresql://bioparser:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/bioparser
      BIOPARSER_ARTIFACT_STORAGE_PATH: /data
      BIOPARSER_PARSE_QUEUE_NAME: parse
      BIOPARSER_EXTRACT_QUEUE_NAME: extract
      BIOPARSER_MINERU_BASE_URL: http://mineru:8000
      BIOPARSER_PARSE_TIME_LIMIT_SECONDS: ${BIOPARSER_PARSE_TIME_LIMIT_SECONDS:-1800}
    volumes:
      - artifacts:/data
    # MinerU runs in its own service. The default backend (pdfplumber) frees each page
    # after reading it: 316 MiB peak on a 150-page, 15 MiB PDF (1.5 GiB without that).
    mem_limit: 2g
    memswap_limit: 2g
    restart: unless-stopped
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  extractor-worker:
    build:
      context: .
      dockerfile: docker/extractor-worker.Dockerfile
    image: bioparser-extractor-worker
    depends_on:
      redis:
        condition: service_healthy
      vllm:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      BIOPARSER_VLLM_BASE_URL: http://vllm:8000/v1
      BIOPARSER_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BIOPARSER_DATABASE_URL: postgresql://bioparser:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/bioparser
      BIOPARSER_ARTIFACT_STORAGE_PATH: /data
      BIOPARSER_EXTRACT_QUEUE_NAME: extract
    volumes:
      - artifacts:/data
    mem_limit: 4g
    memswap_limit: 4g
    restart: unless-stopped
    networks: [backend]

  redis:
    # Also pinned in .github/workflows/ci.yml. Dependabot updates only this line.
    image: redis:8.10.2@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
    user: "999:999"
    command:
      - redis-server
      - --appendonly yes
      - --appendfsync everysec
      - --save ""
      - --maxmemory ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy noeviction
      - --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    networks: [backend]
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  postgres:
    image: postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: bioparser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: bioparser
    volumes:
      # Postgres 18 keeps each major version in its own directory under this path.
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      # -h forces TCP. During first-start init the image runs a temporary server
      # on the Unix socket only; over the socket that server looks ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bioparser -d bioparser"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    # The image's postgres user. A new named volume gets this owner from the image,
    # so the entrypoint needs no root step and no capabilities. Same as redis.
    user: "999:999"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: bioparser-api
    # command replaces the image CMD. The entrypoint stays tini, which runs this.
    command: ["bioparser-migrate"]
    # The API image checks http://127.0.0.1:8080/health. This container runs the
    # migration and exits, so that inherited check would mark a success unhealthy.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BIOPARSER_DATABASE_URL: postgresql://bioparser:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/bioparser
    restart: "no"
    mem_limit: 512m
    memswap_limit: 512m
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  redis-data:
  postgres-data:
  artifacts:
