name: bioparser

networks:
  edge:
  backend:
    internal: true

# Docker secrets: a service reads only the secrets it lists, in /run/secrets. Make the
# files with src/bioparser/scripts/generate_secrets.py (docs/docker-compose.md, "Secrets").
secrets:
  redis_password:
    file: ${BIOPARSER_SECRETS_DIR:-./secrets}/redis_password
  postgres_password:
    file: ${BIOPARSER_SECRETS_DIR:-./secrets}/postgres_password
  postgres_app_password:
    file: ${BIOPARSER_SECRETS_DIR:-./secrets}/postgres_app_password
  bioparser_api_key:
    file: ${BIOPARSER_SECRETS_DIR:-./secrets}/bioparser_api_key
  hf_token:
    file: ${BIOPARSER_SECRETS_DIR:-./secrets}/hf_token

services:
  mineru:
    build:
      context: .
      dockerfile: docker/mineru.Dockerfile
      # target and image come from the overlay; cpu/gpu.yml
    environment:
      # Parse jobs MinerU runs at once; more wait in its queue. Each running job needs its own
      # memory: raise the overlay's mem_limit with it.
      MINERU_API_CONCURRENCY: ${MINERU_API_CONCURRENCY:-1}
    # Only on the internal network, so it cannot be published. For the host scripts see
    # docs/parser.md.
    restart: unless-stopped
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  vllm:
    environment:
      # huggingface_hub reads the token from this file, not from ~/.cache/huggingface/token.
      HF_TOKEN_PATH: /run/secrets/hf_token
    secrets: [hf_token]
    volumes:
      - ${HF_CACHE_DIR:-${USERPROFILE:-${HOME}}/.cache/huggingface}:/root/.cache/huggingface
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    ipc: host
    init: true
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
    # edge is required: vLLM pulls model weights from HuggingFace.
    # Drop to [backend] only once ~/.cache/huggingface has them saved
    # Might need HF_HUB_OFFLINE=1 otherwise it hangs on connect 
    networks: [backend, edge]

  bioparser:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: bioparser-api
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # The URLs hold no password. The settings read each password from its secret.
      BIOPARSER_REDIS_URL: redis://redis:6379/0
      BIOPARSER_DATABASE_URL: postgresql://bioparser_app@postgres:5432/bioparser
      BIOPARSER_ARTIFACT_STORAGE_PATH: /data
      BIOPARSER_PARSE_QUEUE_NAME: parse
      BIOPARSER_AUTH_DISABLED: ${BIOPARSER_AUTH_DISABLED:-false}
    # A target is the name of a setting: see src/bioparser/docker_secrets.py.
    secrets:
      - source: redis_password
        target: bioparser_redis_password
      - source: postgres_app_password
        target: bioparser_database_password
      - bioparser_api_key
    volumes:
      - artifacts:/data
    ports:
      - "127.0.0.1:${BIOPARSER_PORT:-8080}:8080"
    # mineru and vllm get a ceiling from the cpu/gpu overlay; this service had
    # none, so it was the one that could take the host down.
    mem_limit: 4g
    memswap_limit: 4g
    networks: [backend, edge]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  parser-worker:
    build:
      context: .
      dockerfile: docker/parser-worker.Dockerfile
    image: bioparser-parser-worker
    depends_on:
      mineru:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      BIOPARSER_REDIS_URL: redis://redis:6379/0
      BIOPARSER_DATABASE_URL: postgresql://bioparser_app@postgres:5432/bioparser
      BIOPARSER_ARTIFACT_STORAGE_PATH: /data
      BIOPARSER_PARSE_QUEUE_NAME: parse
      BIOPARSER_EXTRACT_QUEUE_NAME: extract
      BIOPARSER_MINERU_BASE_URL: http://mineru:8000
      BIOPARSER_PARSE_TIME_LIMIT_SECONDS: ${BIOPARSER_PARSE_TIME_LIMIT_SECONDS:-1800}
    secrets:
      - source: redis_password
        target: bioparser_redis_password
      - source: postgres_app_password
        target: bioparser_database_password
    volumes:
      - artifacts:/data
    # MinerU runs in its own service. The default backend (pdfplumber) frees each page
    # after reading it: 316 MiB peak on a 150-page, 15 MiB PDF (1.5 GiB without that).
    mem_limit: 2g
    memswap_limit: 2g
    restart: unless-stopped
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  extractor-worker:
    build:
      context: .
      dockerfile: docker/extractor-worker.Dockerfile
    image: bioparser-extractor-worker
    depends_on:
      redis:
        condition: service_healthy
      vllm:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      BIOPARSER_VLLM_BASE_URL: http://vllm:8000/v1
      BIOPARSER_REDIS_URL: redis://redis:6379/0
      BIOPARSER_DATABASE_URL: postgresql://bioparser_app@postgres:5432/bioparser
      BIOPARSER_ARTIFACT_STORAGE_PATH: /data
      BIOPARSER_EXTRACT_QUEUE_NAME: extract
    secrets:
      - source: redis_password
        target: bioparser_redis_password
      - source: postgres_app_password
        target: bioparser_database_password
    volumes:
      - artifacts:/data
    mem_limit: 4g
    memswap_limit: 4g
    restart: unless-stopped
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  redis:
    # Also pinned in .github/workflows/ci.yml. Dependabot updates only this line.
    image: redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
    user: "999:999"
    secrets: [redis_password]
    # The password goes to redis-server on stdin ("-"), not as an argument. Through the
    # image's docker-entrypoint.sh, which loads the modules. "$$@" is the command below.
    entrypoint:
      - sh
      - -ec
      - |
        password=$$(cat /run/secrets/redis_password)
        # The line puts the password between double quotes.
        case $$password in
          "" | *[!!-~]* | *[\"\\]*)
            echo "redis: the redis_password secret must be printable ASCII without spaces, double quotes or backslashes" >&2
            exit 1 ;;
        esac
        exec docker-entrypoint.sh redis-server - "$$@" <<EOF
        requirepass "$$password"
        EOF
      - redis
    command:
      - --appendonly yes
      - --appendfsync everysec
      - --save ""
      - --maxmemory ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    networks: [backend]
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    healthcheck:
      # REDISCLI_AUTH, not -a: no password in an argument. During the AOF load: LOADING.
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -qx PONG'
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: bioparser
      # The image reads the password from this file only when postgres-data is empty.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: bioparser
    secrets: [postgres_password]
    volumes:
      # Postgres 18 keeps each major version in its own directory under this path.
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      # -h forces TCP. During first-start init the image runs a temporary server
      # on the Unix socket only; over the socket that server looks ready too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bioparser -d bioparser"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    # The image's postgres user. A new named volume gets this owner from the image,
    # so the entrypoint needs no root step and no capabilities. Same as redis.
    user: "999:999"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    image: bioparser-migrate
    # command replaces the image CMD. The entrypoint stays tini, which runs this.
    command: ["bioparser-migrate"]
    # The process exits when the upgrade finishes, so a health check would
    # mark a successful run unhealthy.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The superuser login. migrate sets the bioparser_app password at every start.
      BIOPARSER_DATABASE_URL: postgresql://bioparser@postgres:5432/bioparser
    secrets:
      - source: postgres_password
        target: bioparser_database_password
      - postgres_app_password
    restart: "no"
    mem_limit: 512m
    memswap_limit: 512m
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  redis-data:
  postgres-data:
  artifacts:
