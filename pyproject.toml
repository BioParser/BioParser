[project]
name = "bioparser"
version = "0.1.0"
description = "Parsing pdf's for biodata"
readme = "README.md"
authors = [
	{ name = "Joona Pietarinen", email = "187025356+JoonaPietarinen@users.noreply.github.com" },
	{ name = "Jonni Haapiainen", email = "104795321+DualRedd@users.noreply.github.com" },
    { name = "Niklas Harju", email = "38046336+neoharju@users.noreply.github.com" },
	{ name = "Roope", email = "145572041+Roope2003@users.noreply.github.com" },
	{ name = "Kristjan Kaasik", email = "kristjan.kaasik@helsinki.fi" },
]
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
bioparser = "bioparser:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.5",
]
