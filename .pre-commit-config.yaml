# In order to install this hook run `pre-commit install`
default_install_hook_types:
  - pre-commit
repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv 0.12.23. Keep in sync with .github/actions/setup/action.yml.
    rev: "a1785f8e81fe9936d828bef574e6db07e8c8c374"
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]
      
      - id: mypy
        name: mypy
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
