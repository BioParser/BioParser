# In order to install this hook run `pre-commit install`
default_install_hook_types:
  - pre-commit
repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version
    rev: "04970bde2c7315e76a91457d89933b0ffc6ab1f4" # 0.12.16
    hooks:
      - id: uv-lock

  - repo: local 
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
