services:
  mineru:
    build:
      target: cpu
    # CPU version: ONNX small models. The tier is the image's CMD.
    image: bioparser-mineru:cpu
    environment:
      MINERU_INTRA_OP_NUM_THREADS: "4"
      MINERU_PDF_RENDER_THREADS: "2"
    mem_limit: 12g
    memswap_limit: 12g # needed for OOM ?

  vllm:
    image: vllm/vllm-openai-cpu:v0.33.0@sha256:87167cf0ec6e1e9607bb1cf9bf618a67d04963236a34bd955ac75b7d31a6edf5
    command:
      - ${VLLM_MODEL}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - float32
      - --max-model-len
      - "4096"
    environment:
      OMP_NUM_THREADS: "8"
      VLLM_CPU_KVCACHE_SPACE: "4"
    mem_limit: 8g
    healthcheck:
      start_period: 600s
