apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parser-worker
  template:
    metadata:
      labels:
        app: parser-worker
    spec:
      containers:
        - name: parser-worker
          image: ghcr.io/bioparser/bioparser/parser-worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: bioparser-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bioparser-secret
                  key: REDIS_PASSWORD
            - name: POSTGRES_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bioparser-secret
                  key: POSTGRES_APP_PASSWORD
          volumeMounts:
            - mountPath: /data
              name: artifact-storage
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
      volumes:
        - name: artifact-storage
          persistentVolumeClaim:
            claimName: bioparser-artifact-pvc