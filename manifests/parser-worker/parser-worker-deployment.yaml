apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    alpha.image.policy.openshift.io/resolve-names: "*"
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"parser-worker:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"parser-worker\")].image","pause":"false"}]
  name: parser-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parser-worker
  template:
    metadata:
      labels:
        app: parser-worker
    spec:
      containers:
        - name: parser-worker
          image: parser-worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: bioparser-config
            - secretRef:
                name: bioparser-secret
          volumeMounts:
            - mountPath: /data
              name: artifact-storage
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
      volumes:
        - name: artifact-storage
          persistentVolumeClaim:
            claimName: bioparser-artifact-pvc