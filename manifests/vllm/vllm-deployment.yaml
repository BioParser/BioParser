apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai-cpu:v0.29.0-x86_64@sha256:66064cf683152e60eff2e5b18ec2d4ace236fb063c0a241f918691db9caddcf4
          command: ["/bin/sh", "-c"]
          args: [
            "vllm serve Qwen/Qwen3-0.6B --dtype float32"
          ]
          env:
            - name: HOME
              value: "/data"
            - name: ONEDNN_VERBOSE
              value: "0"
            - name: OMP_NUM_THREADS
              value: "4"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bioparser-secret
                  key: HF_TOKEN
            - name: HF_HOME
              value: "/data/huggingface"
            - name: XDG_CACHE_HOME
              value: "/data/.cache"
            - name: VLLM_CACHE_ROOT
              value: "/data/.cache/vllm"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: qwen-storage
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm
          resources:
            limits:
              memory: "32Gi"
              cpu: "8"
            requests:
              memory: "16Gi"
              cpu: "4"
      volumes:
        - name: qwen-storage
          persistentVolumeClaim:
            claimName: vllm-models
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi