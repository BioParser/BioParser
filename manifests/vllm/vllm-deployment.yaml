apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai-cpu:v0.34.0-x86_64@sha256:b14c3a46a4b08852b32528643e070d57f3731cccb0fa33ef86d4f3b3f8ac36c4
          command: ["/bin/sh", "-c"]
          args: [
            "vllm serve Qwen/Qwen3.5-4B --dtype bfloat16 --max-model-len 20000 --kv-cache-memory-bytes 2147483648 --max-num-seqs 1 --enforce-eager --language-model-only"
          ]
          env:
            - name: HOME
              value: "/data"
            - name: ONEDNN_VERBOSE
              value: "0"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bioparser-secret
                  key: HF_TOKEN
            - name: HF_HOME
              value: "/data/huggingface"
            - name: XDG_CACHE_HOME
              value: "/data/.cache"
            - name: VLLM_CACHE_ROOT
              value: "/data/.cache/vllm"
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: qwen-storage
              mountPath: /data
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              memory: "32Gi"
              cpu: "12"
            limits:
              memory: "40Gi"
              cpu: "16"
      volumes:
        - name: qwen-storage
          persistentVolumeClaim:
            claimName: vllm-models
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi