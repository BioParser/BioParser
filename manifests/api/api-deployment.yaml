apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    alpha.image.policy.openshift.io/resolve-names: "*"
    image.openshift.io/triggers: >-
      [
        {"from":{"kind":"ImageStreamTag","name":"bioparser-api:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"bioparser-api\")].image"},
        {"from":{"kind":"ImageStreamTag","name":"migrate:latest"},"fieldPath":"spec.template.spec.initContainers[?(@.name==\"migrate\")].image"}
      ]
  name: bioparser-api-dep
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: bioparser-api
  template:
    metadata:
      labels:
        app: bioparser-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo "waiting for postgres..."; sleep 2; done
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
        - name: migrate
          image: migrate:latest
          imagePullPolicy: Always
          command: ["bioparser-migrate"]
          env:
            - name: BIOPARSER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bioparser-secret
                  key: BIOPARSER_DATABASE_URL
            - name: POSTGRES_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bioparser-secret
                  key: POSTGRES_APP_PASSWORD
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      containers:
        - name: bioparser-api
          image: bioparser-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: bioparser-config
          env:
            - name: BIOPARSER_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: bioparser-secret
                  key: BIOPARSER_REDIS_URL
            - name: BIOPARSER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bioparser-secret
                  key: BIOPARSER_DATABASE_URL
            - name: BIOPARSER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bioparser-secret
                  key: BIOPARSER_API_KEY
          volumeMounts:
            - mountPath: /data
              name: artifact-storage
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: artifact-storage
          persistentVolumeClaim:
            claimName: bioparser-artifact-pvc