apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    alpha.image.policy.openshift.io/resolve-names: "*"
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"bioparser-api:latest","namespace":"biogpt-ohtu-s2026"},"fieldPath":"spec.template.spec.containers[?(@.name==\"bioparser-api\")].image","pause":"false"}]
  name: bioparser-api-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bioparser-api
  template:
    metadata:
      labels:
        app: bioparser-api
    spec:
      containers:
        - name: bioparser-api
          image: ghcr.io/bioparser/bioparser/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: BIOPARSER_VLLM_BASE_URL
              value: http://vllm:8000/v1
            - name: BIOPARSER_MINERU_BASE_URL
              value: http://mineru:8000
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "50Mi"
              cpu: "50m"