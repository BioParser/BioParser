apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    alpha.image.policy.openshift.io/resolve-names: "*"
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"bioparser-api:latest","namespace":"biogpt-ohtu-s2026"},"fieldPath":"spec.template.spec.containers[?(@.name==\"bioparser-api\")].image","pause":"false"}]
  name: bioparser-api-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bioparser-api
  template:
    metadata:
      labels:
        app: bioparser-api
    spec:
      # The pod does not use the Kubernetes API. Kubernetes mounts the API token in
      # /var/run/secrets, which is /run/secrets in a Debian image: the secrets volume below.
      automountServiceAccountToken: false
      containers:
        - name: bioparser-api
          image: ghcr.io/bioparser/bioparser/api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: bioparser-config
          volumeMounts:
            - mountPath: /data
              name: artifact-storage
            # The settings read each file that has the name of a setting (secrets_dir).
            - mountPath: /run/secrets
              name: secrets
              readOnly: true
          resources:
            limits:
              memory: "4Gi"
              cpu: "1"
            requests:
              memory: "2Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: artifact-storage
          persistentVolumeClaim:
            claimName: bioparser-artifact-pvc
        # Only the keys of this pod. Mode 0440: only the owner (root) and the group read the
        # files. The container user of OKD is in that group.
        - name: secrets
          secret:
            secretName: bioparser-secret
            defaultMode: 0440
            items:
              - key: REDIS_PASSWORD
                path: bioparser_redis_password
              - key: POSTGRES_APP_PASSWORD
                path: bioparser_database_password
              - key: BIOPARSER_API_KEY
                path: bioparser_api_key
