kind: ImageStream
apiVersion: image.openshift.io/v1
metadata:
  name: migrate
  labels:
    app: migrate
spec:
  lookupPolicy:
    local: false
  tags:
    - name: latest
      from:
        kind: DockerImage
        name: ghcr.io/bioparser/bioparser/migrate:latest
      importPolicy:
        scheduled: true
      referencePolicy:
        type: Local