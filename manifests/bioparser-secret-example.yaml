# THIS IS AN EXAMPLE SECRET. Copy it, fill it and name the copy `bioparser-secret.yaml`.

apiVersion: v1
kind: Secret
metadata:
  name: bioparser-secret
  # Add your namespace here
  namespace:
type: Opaque
data:
  # THE VALUES NEED TO BE BASE64-ENCODED VALUES
  # Values can be encoded with: echo -n "secret-value" | base64
  # pick one
  REDIS_PASSWORD:
  # generate both with openssl rand -hex 32
  POSTGRES_PASSWORD:
  POSTGRES_APP_PASSWORD:
  # get from your READ token from you hugging face account
  HF_TOKEN:
  # generate with python3 -c 'import secrets; print(secrets.token_urlsafe(32))'
  BIOPARSER_API_KEY: