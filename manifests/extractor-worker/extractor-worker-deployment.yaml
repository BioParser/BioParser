apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    alpha.image.policy.openshift.io/resolve-names: "*"
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"extractor-worker:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"extractor-worker\")].image","pause":"false"}]
  name: extractor-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: extractor-worker
  template:
    metadata:
      labels:
        app: extractor-worker
    spec:
      containers:
        - name: extractor-worker
          image: extractor-worker:latest
          envFrom:
            - configMapRef:
                name: bioparser-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bioparser-secret
                  key: REDIS_PASSWORD
            - name: POSTGRES_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bioparser-secret
                  key: POSTGRES_APP_PASSWORD
          volumeMounts:
            - mountPath: /data
              name: artifact-storage
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
      volumes:
        - name: artifact-storage
          persistentVolumeClaim:
            claimName: bioparser-artifact-pvc