apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    alpha.image.policy.openshift.io/resolve-names: "*"
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"extractor-worker:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"extractor-worker\")].image","pause":"false"}]
  name: extractor-worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: extractor-worker
  template:
    metadata:
      labels:
        app: extractor-worker
    spec:
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -q -O /dev/null http://bioparser:8080/ready; do echo "waiting for api..."; sleep 2; done
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      containers:
        - name: extractor-worker
          image: extractor-worker:latest
          imagePullPolicy: Always
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: bioparser-config
          env:
            - name: BIOPARSER_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: bioparser-secret
                  key: BIOPARSER_REDIS_URL
            - name: BIOPARSER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bioparser-secret
                  key: BIOPARSER_DATABASE_URL
          volumeMounts:
            - mountPath: /data
              name: artifact-storage
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: artifact-storage
          persistentVolumeClaim:
            claimName: bioparser-artifact-pvc