apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    alpha.image.policy.openshift.io/resolve-names: "*"
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"extractor-worker:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"extractor-worker\")].image","pause":"false"}]
  name: extractor-worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: extractor-worker
  template:
    metadata:
      labels:
        app: extractor-worker
    spec:
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          command:
            - sh
            - -c
            - until wget -q -O /dev/null http://bioparser:8080/ready; do echo "waiting for api..."; sleep 2; done
      containers:
        - name: extractor-worker
          image: extractor-worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: bioparser-config
            - secretRef:
                name: bioparser-secret
          volumeMounts:
            - mountPath: /data
              name: artifact-storage
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
      volumes:
        - name: artifact-storage
          persistentVolumeClaim:
            claimName: bioparser-artifact-pvc