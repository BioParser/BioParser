kind: ImageStream
apiVersion: image.openshift.io/v1
metadata:
  name: mineru
  labels:
    app: mineru
spec:
  lookupPolicy:
    local: false
  tags:
    - name: cpu
      from:
        kind: DockerImage
        name: ghcr.io/bioparser/bioparser/mineru:cpu
      importPolicy:
        scheduled: true
      referencePolicy:
        type: Local