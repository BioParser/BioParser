apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    alpha.image.policy.openshift.io/resolve-names: "*"
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"mineru:cpu"},"fieldPath":"spec.template.spec.containers[?(@.name==\"mineru-cpu\")].image","pause":"false"}]
  name: mineru
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: mineru
  template:
    metadata:
      labels:
        app: mineru
    spec:
      containers:
        - name: mineru-cpu
          image: mineru:cpu
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 0
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: HF_HOME
              value: /tmp/hf-cache
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bioparser-secret
                  key: HF_TOKEN
            - name: MINERU_API_CONCURRENCY
              valueFrom:
                configMapKeyRef:
                  name: bioparser-config
                  key: MINERU_API_CONCURRENCY
            - name: MINERU_INTRA_OP_NUM_THREADS
              value: "4"
            - name: MINERU_PDF_RENDER_THREADS
              value: "2"
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
            limits:
              cpu: "4"
              memory: "12Gi"
          volumeMounts:
            - name: tmp-cache
              mountPath: /tmp
      volumes:
        - name: tmp-cache
          emptyDir:
            sizeLimit: 5Gi