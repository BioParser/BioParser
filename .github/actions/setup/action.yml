name: Setup Python
description: Install the pinned uv, Python 3.13, and locked dependencies.

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        # Keep in sync with the uv-pre-commit rev in .pre-commit-config.yaml.
        version: "0.12.18"
        enable-cache: true

    - name: Set up Python
      shell: bash
      run: uv python install

    - name: Install dependencies
      shell: bash
      run: uv sync --locked --dev
