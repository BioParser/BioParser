name: GitHub CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: ./.github/actions/setup

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: ./.github/actions/setup

      - name: mypy
        run: uv run mypy

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: uv run pytest -m "not integration"

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: ./.github/actions/setup

      - name: Start Redis
        run: |
          # Same image as services.redis in docker-compose.yml. Dependabot does
          # not update this line; bump it in the same change as the Compose pin.
          docker run -d --name redis -p 6379:6379 \
            redis:8.10.2@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6 \
            redis-server --appendonly yes --appendfsync everysec --save "" \
              --maxmemory 256mb --maxmemory-policy noeviction
          for i in $(seq 1 10); do
            docker exec redis redis-cli ping 2>/dev/null && break
            sleep 1
          done
          docker exec redis redis-cli ping

      - name: Run integration tests
        run: uv run pytest -m integration

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gen:api runs Python to write the API's OpenAPI schema.
      - name: Setup Python
        uses: ./.github/actions/setup

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- openapi.json src/api/schema.d.ts \
            || { echo "::error::The API changed. Run 'npm run gen:api' in frontend/ and commit the result."; exit 1; }

      - name: Lint and format
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build