name: GitHub CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: ./.github/actions/setup

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: ./.github/actions/setup

      - name: mypy
        run: uv run mypy

  test-unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }} # Win64/Ubuntu arm failure wont fail run for Ubuntu x64
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: ./.github/actions/setup

      - name: Run unit tests
        # The compose job below runs the compose tests.
        run: uv run pytest -m "not integration and not image and not compose"

  test-integration:
    name: Integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm] # The redis container is for linux only

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: ./.github/actions/setup

      - name: Start Redis
        run: |
          # Same image as services.redis in docker-compose.yml. Dependabot does
          # not update this line; bump it in the same change as the Compose pin.
          docker run -d --name redis -p 6379:6379 \
            redis:8.10.2@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901 \
            redis-server --appendonly yes --appendfsync everysec --save "" \
              --maxmemory 256mb --maxmemory-policy noeviction
          for i in $(seq 1 10); do
            docker exec redis redis-cli ping 2>/dev/null && break
            sleep 1
          done
          docker exec redis redis-cli ping

      - name: Start Postgres
        run: |
          # Same image as services.postgres in docker-compose.yml. Dependabot does
          # not update this line; bump it in the same change as the Compose pin.
          # The password exists only in this job.
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=bioparser \
            -e POSTGRES_PASSWORD=ci-postgres \
            -e POSTGRES_DB=bioparser \
            postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -h 127.0.0.1 -U bioparser -d bioparser && break
            sleep 1
          done
          docker exec postgres pg_isready -h 127.0.0.1 -U bioparser -d bioparser

      - name: Prepare the application role
        env:
          BIOPARSER_DATABASE_URL: postgresql://bioparser:ci-postgres@localhost:5432/bioparser
          POSTGRES_APP_PASSWORD: ci-app-password
        run: uv run bioparser-migrate

      - name: Run integration tests
        env:
          BIOPARSER_TEST_DATABASE_URL: postgresql://bioparser:ci-postgres@localhost:5432/bioparser
        run: uv run pytest -m integration

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gen:api runs Python to write the API's OpenAPI schema.
      - name: Setup Python
        uses: ./.github/actions/setup

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- openapi.json src/api/schema.d.ts \
            || { echo "::error::The API changed. Run 'npm run gen:api' in frontend/ and commit the result."; exit 1; }

      - name: Lint and format
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  image-groups:
    name: Image dependency groups
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: ./.github/actions/setup

      - name: Check each image group
        run: uv run pytest -m image

  compose:
    name: Validate Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the parent commit too, for the changed files below

      - name: Validate Compose files
        env:
          # The Traefik overlay rejects an empty users file path. .env.example leaves it empty.
          TRAEFIK_USERS_FILE: docker/traefik/users.example
        run: |
          set -euo pipefail
          # cpu.yml or gpu.yml supplies the vLLM image. The base file alone does not.
          validate() {
            docker compose --env-file .env.example "$@" config --quiet
          }
          # Traefik must not start without a users file the operator made.
          if TRAEFIK_USERS_FILE= validate -f docker-compose.yml -f docker-compose.cpu.yml \
              -f docker-compose.traefik.yml 2>/dev/null; then
            echo "docker-compose.traefik.yml accepted an empty TRAEFIK_USERS_FILE" >&2
            exit 1
          fi
          validate -f docker-compose.yml -f docker-compose.cpu.yml
          validate -f docker-compose.yml -f docker-compose.gpu.yml
          validate -f docker-compose.yml -f docker-compose.cpu.yml -f docker-compose.logging.yml
          validate -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.logging.yml
          validate -f docker-compose.yml -f docker-compose.cpu.yml -f docker-compose.logging.yml -f docker-compose.traefik.yml
          validate -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.logging.yml -f docker-compose.traefik.yml
          validate -f docker-compose.yml -f docker-compose.cpu.yml -f docker-compose.dev.yml
          validate -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.dev.yml
          validate -f docker-compose.yml -f docker-compose.cpu.yml -f docker-compose.logging.yml -f docker-compose.dev.yml
          validate -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.logging.yml -f docker-compose.dev.yml
          validate -f docker-compose.yml -f docker-compose.cpu.yml -f docker-compose.logging.yml -f docker-compose.traefik.yml -f docker-compose.dev.yml
          validate -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.logging.yml -f docker-compose.traefik.yml -f docker-compose.dev.yml

      # The stack test builds four images and starts the stack: only for a change that can
      # move a secret. It is in GitHub CI: on main, the deploy waits for it.
      - name: Find a change that can move a secret
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          pattern='^(docker-compose[^/]*\.yml|\.env\.example|\.dockerignore|docker/.*'
          pattern+='|src/bioparser/(docker_secrets|scripts/generate_secrets)\.py'
          pattern+='|tests/test_compose_[^/]*\.py|\.github/workflows/ci\.yml)$'
          # If git cannot find the base commit, the stack test runs too.
          if ! files=$(git diff --name-only "$BASE" HEAD) || grep -qE "$pattern" <<< "$files"; then
            echo "stack=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: ./.github/actions/setup

      # The python3 of the runner, as on a host. With ./secrets in the build context, the
      # image check also proves that no build copies the directory.
      - name: Make the secret files
        if: steps.changes.outputs.stack == '1'
        run: python3 src/bioparser/scripts/generate_secrets.py

      # The secrets are files: no step here sets a password.
      - name: Check the secrets in the Compose config and in a running stack
        env:
          BIOPARSER_TEST_COMPOSE_STACK: ${{ steps.changes.outputs.stack }}
        run: uv run pytest -m compose -v
