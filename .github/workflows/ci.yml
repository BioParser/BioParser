name: GitHub CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: ./.github/actions/setup

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: ./.github/actions/setup

      - name: mypy
        run: uv run mypy

  test-unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }} # Win64/Ubuntu arm failure wont fail run for Ubuntu x64
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: uv run pytest -m "not integration"

  test-integration:
    name: Integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm] # The redis container is for linux only

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: ./.github/actions/setup

      - name: Start Redis
        run: |
          # Same image as services.redis in docker-compose.yml. Dependabot does
          # not update this line; bump it in the same change as the Compose pin.
          docker run -d --name redis -p 6379:6379 \
            redis:8.10.2@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6 \
            redis-server --appendonly yes --appendfsync everysec --save "" \
              --maxmemory 256mb --maxmemory-policy noeviction
          for i in $(seq 1 10); do
            docker exec redis redis-cli ping 2>/dev/null && break
            sleep 1
          done
          docker exec redis redis-cli ping

      - name: Start Postgres
        run: |
          # Same image as services.postgres in docker-compose.yml. Dependabot does
          # not update this line; bump it in the same change as the Compose pin.
          # The password exists only in this job.
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=bioparser \
            -e POSTGRES_PASSWORD=ci-postgres \
            -e POSTGRES_DB=bioparser \
            postgres:18.6@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U bioparser -d bioparser && break
            sleep 1
          done
          docker exec postgres pg_isready -U bioparser -d bioparser

      - name: Run integration tests
        env:
          BIOPARSER_TEST_DATABASE_URL: postgresql://bioparser:ci-postgres@localhost:5432/bioparser
        run: uv run pytest -m integration
