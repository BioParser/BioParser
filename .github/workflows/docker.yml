name: Build and Push Local Docker Images

on:
  push:
    branches: [main]

permissions:
  contents: read # fetch code
  packages: write # write image

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    # checkout code
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR login
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # build the locally defined Docker images and push them to GHCR
      # API
      - name: Build and push API image
        run: |
          IMAGE=ghcr.io/bioparser/bioparser/api
          docker buildx build --push \
            -f docker/api.Dockerfile \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
              .
      # parser-worker
      - name: Build and push parser-worker image
        run: |
          IMAGE=ghcr.io/bioparser/bioparser/parser-worker
          docker buildx build --push \
            -f docker/parser-worker.Dockerfile \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
              .
      # extractor-worker
      - name: Build and push extractor-worker image
        run: |
          IMAGE=ghcr.io/bioparser/bioparser/extractor-worker
          docker buildx build --push \
            -f docker/extractor-worker.Dockerfile \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
              .