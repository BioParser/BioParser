name: Compose secrets

# Builds two images and starts the stack: only for a change that can move a secret.
on:
  pull_request:
    paths:
      - "docker-compose*.yml"
      - ".env.example"
      - ".dockerignore"
      - "docker/**"
      - "src/bioparser/docker_secrets.py"
      - "src/bioparser/scripts/generate_secrets.py"
      - "tests/test_compose_*.py"
      - ".github/workflows/compose-secrets.yml"

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  stack:
    name: Secrets in a running stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: ./.github/actions/setup

      # The python3 of the runner, as on a host. With ./secrets in the build context, the
      # image check also proves that no build copies the directory.
      - name: Make the secret files
        run: python3 src/bioparser/scripts/generate_secrets.py

      - name: Check the secrets in a running stack
        env:
          BIOPARSER_TEST_COMPOSE_STACK: "1"
        run: uv run pytest -v tests/test_compose_stack.py
