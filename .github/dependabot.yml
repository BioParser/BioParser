version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CI"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CI"
    cooldown:
      default-days: 7
    ignore:
      # This rev is the uv release CI pins by hand. Bump both manually.
      - dependency-name: "https://github.com/astral-sh/uv-pre-commit"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      uv-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Base images under docker/.
  - package-ecosystem: "docker"
    directories:
      - "/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(docker)"
    cooldown:
      default-days: 7
    ignore:
      # Python 3.13 is pinned
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # Node is pinned in the Dockerfiles and .nvmrc. Dependabot cannot
      # update .nvmrc, so bump the image tag, the digest, and .nvmrc by hand.
      - dependency-name: "node"
      # This image is the uv release CI pins by hand. Bump both manually.
      - dependency-name: "ghcr.io/astral-sh/uv"
    groups:
      base-images:
        patterns:
          - "*"

  # Images in docker-compose.yml, docker-compose.cpu.yml, docker-compose.gpu.yml,
  # and docker-compose.dev.yml.
  # redis is also pinned in .github/workflows/ci.yml. Bump both manually.
  # Node is ignored above. The dev frontend pin, the API ui stage, and .nvmrc
  # move together by hand.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(docker)"
    cooldown:
      default-days: 7
    groups:
      vllm:
        patterns:
          - "vllm/vllm-openai"
          - "vllm/vllm-openai-cpu"

  # frontend/package.json. Node itself is pinned in .nvmrc and the Dockerfiles.
  # Dependabot does not bump it.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"