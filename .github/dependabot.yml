version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CI"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CI"
    cooldown:
      default-days: 7
    ignore:
      # This rev is the uv release CI and the Docker images pin by hand.
      - dependency-name: "https://github.com/astral-sh/uv-pre-commit"
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      uv-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Base images under docker/.
  - package-ecosystem: "docker"
    directories:
      - "/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(docker)"
    cooldown:
      default-days: 7
    ignore:
      # Python 3.13 is pinned
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # The uv image matches the CI and pre-commit pins. Bump those by hand.
      - dependency-name: "astral-sh/uv"
    groups:
      base-images:
        patterns:
          - "*"

  # Images in docker-compose.yml, docker-compose.cpu.yml and docker-compose.gpu.yml.
  # redis is also pinned in .github/workflows/ci.yml. Bump both manually.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(docker)"
    cooldown:
      default-days: 7
    groups:
      vllm:
        patterns:
          - "vllm/vllm-openai"
          - "vllm/vllm-openai-cpu"
