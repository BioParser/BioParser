# logs: Alloy reads every container's output. Loki stores; Grafana visualizes them.
# Turned on by the COMPOSE_FILE line in .env. Grafana: http://localhost:3000 (GRAFANA_PORT)
x-require-grafana-password: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}

networks:
  logs:
    internal: true
  # Only alloy and docker-api. docker-api is the one container that holds the
  # Docker socket.
  docker-api:
    internal: true

secrets:
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD

services:
  docker-api:
    # Built from a pinned upstream commit, see docker/socket-proxy.Dockerfile
    build:
      context: docker
      dockerfile: socket-proxy.Dockerfile
    image: bioparser-socket-proxy:1.13.1
    # uid 0 owns the socket on every host; the docker group id differs per host.
    # No capabilities and a read-only root, it can only forward allowed requests.
    user: "0:0"
    command:
      - -listenip=0.0.0.0
      - -allowfrom=alloy
      # discovery.docker and loki.source.docker call: ping, list, inspect
      # (TTY check) and logs
      - -allowHEAD=(/v1\.[0-9]+)?/_ping
      - -allowGET=(/v1\.[0-9]+)?/(_ping|version|networks|containers/json|containers/[0-9a-f]{64}/(json|logs))
      # Exit when the socket breaks (e.g. after a Docker upgrade); restart reconnects.
      - -watchdoginterval=60
      - -stoponwatchdog
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    restart: unless-stopped
    read_only: true
    mem_limit: 64m
    memswap_limit: 64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command:
      - -config.file=/etc/loki/loki.yaml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-168h}
    volumes:
      - ./docker/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks: [logs]
    restart: unless-stopped
    # Loki writes only to /loki
    read_only: true
    mem_limit: 1g
    memswap_limit: 1g
    # Queries and compaction
    cpus: "1.0"
    healthcheck:
      # The image has no shell or curl; the loki binary checks its own /ready.
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    # alloy user, which owns /var/lib/alloy.
    # it reaches Docker through docker-api, not the socket.
    user: "473:473"
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
      docker-api:
        condition: service_started
    networks: [logs, docker-api]
    restart: unless-stopped
    read_only: true
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.5"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      # Read once, when the grafana-data volume is new. Change it later in the
      # Grafana UI or with grafana cli. A file keeps it out of `docker inspect`.
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      # No usage reports or update checks
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # The bundled Loki data source stays at the image's version.
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      # Logs Drilldown is not in the image: Grafana downloads it from grafana.com
      # bump it together with the Grafana image.
      GF_PLUGINS_PREINSTALL: grafana-lokiexplore-app@3.0.0
      # This migration needs the disabled prometheus plugin and logs two errors
      # at every start. There are no Prometheus data sources to migrate.
      GF_FEATURE_TOGGLES_prometheusTypeMigration: "false"
      # to add another data source, remove its plugin from this list.
      GF_PLUGINS_DISABLE_PLUGINS: elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,mssql,mysql,opentsdb,prometheus,stackdriver,tempo,zipkin,grafana-exploretraces-app,grafana-metricsdrilldown-app,grafana-pyroscope-app,grafana-advisor-app
      # Only warnings and errors
      # gzip also warns about every cached file, so filter set to error
      GF_LOG_LEVEL: warn
      GF_LOG_FILTERS: middleware.gzip:error
      # The page you land on after login
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/bioparser-logs.json
    secrets: [grafana_admin_password]
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      loki:
        condition: service_healthy
    networks: [logs, edge]
    restart: unless-stopped
    # 512m (Grafana's documented minimum) is too little
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  loki-data:
  alloy-data:
  grafana-data:
